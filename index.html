<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b0d12" />
    <meta name="description" content="Look up a Roblox user's last online time and current presence by username or ID." />

    />
    <title>Roblox Last Online Lookup</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0d12;
        --bg-glow: #151a2b;
        --surface: #141821;
        --surface-2: #1b212d;
        --border: #262d3c;
        --text: #e8ebf2;
        --text-dim: #9aa3b5;
        --text-faint: #6b7487;
        --accent: #7c9cff;
        --accent-strong: #5f82ff;
        --danger: #ff6b7a;
        --online: #3ddc97;
        --ingame: #58b5ff;
        --studio: #ffb454;
        --offline: #7d8597;
        --radius: 14px;
        --font: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', system-ui, -apple-system,
          'Segoe UI', sans-serif;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      html {
        background: var(--bg);
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: var(--font);
        font-size: 16px;
        line-height: 1.55;
        word-break: keep-all;
        overflow-wrap: break-word;
        color: var(--text);
        background: radial-gradient(900px 420px at 50% -80px, var(--bg-glow), transparent 70%), var(--bg);
        -webkit-font-smoothing: antialiased;
      }

      h1,
      h2,
      p {
        margin: 0;
      }

      button,
      input {
        font: inherit;
        color: inherit;
      }

      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
        border: 0;
      }

      /* Layout */
      .page {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        max-width: 720px;
        margin: 0 auto;
        padding: 20px 20px 0;
      }

      .lang__select {
        padding: 6px 10px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        font-size: 0.85rem;
        color: var(--text-dim);
        cursor: pointer;
      }

      .lang__select:hover {
        color: var(--text);
        border-color: #33405a;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-weight: 700;
        letter-spacing: 0.01em;
        color: var(--accent);
      }

      .main {
        width: 100%;
        max-width: 720px;
        margin: 0 auto;
        padding: 40px 20px 56px;
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .hero {
        text-align: center;
        margin-bottom: 8px;
      }

      .hero h1 {
        font-size: clamp(1.6rem, 4.5vw, 2.2rem);
        line-height: 1.25;
        letter-spacing: -0.02em;
      }

      .hero p {
        margin-top: 10px;
        color: var(--text-dim);
      }

      .footer {
        max-width: 720px;
        margin: 0 auto;
        padding: 0 20px 32px;
        text-align: center;
        font-size: 0.8rem;
        color: var(--text-faint);
      }

      /* Search */
      .search {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .segmented {
        display: inline-flex;
        align-self: center;
        margin: 0;
        padding: 4px;
        gap: 4px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 999px;
      }

      .segmented__option {
        position: relative;
        cursor: pointer;
      }

      .segmented__option input {
        position: absolute;
        inset: 0;
        opacity: 0;
        cursor: pointer;
      }

      .segmented__option span {
        display: block;
        padding: 7px 18px;
        border-radius: 999px;
        font-size: 0.9rem;
        color: var(--text-dim);
        transition: background 0.15s, color 0.15s;
      }

      .segmented__option input:checked + span {
        background: var(--accent-strong);
        color: #fff;
        font-weight: 600;
      }

      .segmented__option input:focus-visible + span {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .search__row {
        display: flex;
        gap: 10px;
      }

      .search__input {
        flex: 1;
        min-width: 0;
        padding: 14px 16px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        font-size: 1.05rem;
        transition: border-color 0.15s, box-shadow 0.15s;
      }

      .search__input::placeholder {
        color: var(--text-faint);
      }

      .search__input:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgb(124 156 255 / 0.2);
      }

      .search__input[aria-invalid='true'] {
        border-color: var(--danger);
      }

      .field-error {
        min-height: 1.2em;
        margin-top: -4px;
        font-size: 0.85rem;
        color: var(--danger);
      }

      /* Buttons */
      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 10px 16px;
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: 10px;
        font-size: 0.9rem;
        font-weight: 500;
        color: var(--text);
        text-decoration: none;
        cursor: pointer;
        transition: background 0.15s, border-color 0.15s;
      }

      .button:hover:not(:disabled) {
        background: #232b3b;
        border-color: #33405a;
      }

      .button:disabled {
        opacity: 0.6;
        cursor: progress;
      }

      .button--primary {
        padding-inline: 26px;
        background: var(--accent-strong);
        border-color: transparent;
        border-radius: var(--radius);
        font-size: 1rem;
        font-weight: 600;
        color: #fff;
      }

      .button--primary:hover:not(:disabled) {
        background: var(--accent);
        border-color: transparent;
      }

      .link-button {
        padding: 0;
        background: none;
        border: 0;
        font-size: 0.8rem;
        color: var(--text-faint);
        text-decoration: underline;
        cursor: pointer;
      }

      .link-button:hover {
        color: var(--text-dim);
      }

      /* Recent searches */
      .recent {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 10px;
      }

      .recent__title {
        font-size: 0.8rem;
        font-weight: 500;
        color: var(--text-faint);
      }

      .recent__list {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .chip {
        padding: 4px 12px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 999px;
        font-size: 0.85rem;
        color: var(--text-dim);
        cursor: pointer;
      }

      .chip:hover {
        color: var(--text);
        border-color: #33405a;
      }

      /* Result card */
      .results {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .card {
        display: flex;
        flex-direction: column;
        gap: 18px;
        padding: 22px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 18px;
        box-shadow: 0 12px 40px rgb(0 0 0 / 0.35);
      }

      .card[aria-busy='true'] {
        opacity: 0.75;
      }

      .card__header {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .avatar {
        flex: none;
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: var(--surface-2);
        border: 2px solid var(--border);
        object-fit: cover;
      }

      .identity {
        flex: 1 1 140px;
        min-width: 0;
      }

      .identity__display {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 1.35rem;
        line-height: 1.3;
        overflow-wrap: anywhere;
      }

      .verified {
        flex: none;
        width: 20px;
        height: 20px;
        color: var(--accent);
      }

      .identity__name {
        color: var(--text-dim);
      }

      .identity__meta {
        display: flex;
        flex-wrap: wrap;
        gap: 2px 14px;
        margin-top: 4px;
        font-size: 0.82rem;
        color: var(--text-faint);
      }

      .tag {
        align-self: flex-start;
        padding: 3px 10px;
        border-radius: 999px;
        font-size: 0.75rem;
        font-weight: 600;
      }

      .tag--danger {
        background: rgb(255 107 122 / 0.14);
        color: var(--danger);
      }

      /* Presence */
      .presence {
        position: relative;
        padding: 18px 20px;
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-left: 4px solid var(--offline);
        border-radius: 12px;
      }

      .presence--online {
        border-left-color: var(--online);
      }

      .presence--ingame {
        border-left-color: var(--ingame);
      }

      .presence--studio,
      .presence--unavailable {
        border-left-color: var(--studio);
      }

      .presence__top {
        position: absolute;
        top: 16px;
        right: 18px;
      }

      .presence__label {
        font-size: 0.8rem;
        color: var(--text-faint);
      }

      .presence__headline {
        margin-top: 2px;
        font-size: 1.7rem;
        font-weight: 700;
        line-height: 1.3;
        letter-spacing: -0.02em;
      }

      .presence--unavailable .presence__headline {
        font-size: 1.1rem;
      }

      .presence__note {
        margin-top: 4px;
        font-size: 0.9rem;
        color: var(--text-dim);
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 4px 12px 4px 10px;
        border-radius: 999px;
        background: rgb(125 133 151 / 0.14);
        font-size: 0.8rem;
        font-weight: 600;
        color: var(--offline);
      }

      .status__dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: currentColor;
      }

      .status--online {
        background: rgb(61 220 151 / 0.14);
        color: var(--online);
      }

      .status--ingame {
        background: rgb(88 181 255 / 0.14);
        color: var(--ingame);
      }

      .status--studio {
        background: rgb(255 180 84 / 0.14);
        color: var(--studio);
      }

      .status--online .status__dot,
      .status--ingame .status__dot,
      .status--studio .status__dot {
        animation: pulse 1.8s ease-in-out infinite;
      }

      .bio {
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
        font-size: 0.9rem;
        color: var(--text-dim);
        white-space: pre-line;
        overflow-wrap: anywhere;
      }

      .card__actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      /* Notices */
      .notice {
        padding: 16px 18px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text-dim);
      }

      .notice--error {
        border-color: rgb(255 107 122 / 0.4);
        background: rgb(255 107 122 / 0.07);
      }

      .notice__body {
        white-space: pre-line;
        overflow-wrap: anywhere;
      }

      .notice__title {
        font-weight: 600;
        color: var(--text);
      }

      /* Skeleton */
      .skeleton {
        background: linear-gradient(90deg, var(--surface-2) 25%, #232b3b 50%, var(--surface-2) 75%);
        background-size: 200% 100%;
        animation: shimmer 1.4s linear infinite;
        border-radius: 8px;
      }

      .avatar.skeleton {
        border: 0;
        border-radius: 50%;
      }

      .skeleton--line {
        height: 16px;
        margin-bottom: 10px;
      }

      .skeleton--w60 {
        width: 60%;
      }

      .skeleton--w40 {
        width: 40%;
      }

      .skeleton--block {
        height: 110px;
        border-radius: 12px;
      }

      @keyframes shimmer {
        to {
          background-position: -200% 0;
        }
      }

      @keyframes pulse {
        50% {
          opacity: 0.35;
        }
      }

      @media (max-width: 480px) {
        .main {
          padding-top: 28px;
        }

        .search__row {
          flex-direction: column;
        }

        .button--primary {
          padding-block: 13px;
        }

        .card {
          padding: 18px;
        }

        .card__header {
          flex-wrap: wrap;
        }

        .presence__top {
          position: static;
          margin-bottom: 8px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>

        <span class="brand">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">

            <path d="M12 7v5l3 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
          <span data-i18n="brand">Last Online</span>
        </span>
        <div class="lang">
          <label class="visually-hidden" for="lang" data-i18n="language.label">Language</label>
          <select id="lang" class="lang__select"></select>
        </div>
      </header>

      <main class="main">
        <section class="hero">
          <h1 data-i18n="hero.title">Roblox Last Online Lookup</h1>
          <p data-i18n="hero.subtitle">Check a user's last online time and current presence by username or user ID.</p>
        </section>

        <form class="search" id="form" novalidate>
          <fieldset class="segmented">
            <legend class="visually-hidden" data-i18n="search.legend">Search by</legend>
            <label class="segmented__option">
              <input type="radio" name="mode" value="name" checked />
              <span data-i18n="search.mode.name">Username</span>
            </label>
            <label class="segmented__option">
              <input type="radio" name="mode" value="id" />
              <span data-i18n="search.mode.id">User ID</span>
            </label>
          </fieldset>

          <div class="search__row">
            <label class="visually-hidden" for="query" id="query-label">Username</label>
            <input
              id="query"
              class="search__input"
              type="text"
              placeholder="e.g. builderman"
              maxlength="20"
              autocomplete="off"
              autocapitalize="none"
              spellcheck="false"
              aria-invalid="false"
            />
            <button class="button button--primary" type="submit" id="submit" data-i18n="search.submit">Search</button>
          </div>

          <p class="field-error" id="field-error" role="alert"></p>
        </form>

        <section class="recent" id="recent" data-i18n-aria="recent.title" hidden>
          <h2 class="recent__title" data-i18n="recent.title">Recent searches</h2>
          <ul class="recent__list" id="recent-list"></ul>
          <button type="button" class="link-button" id="recent-clear" data-i18n="recent.clear">Clear</button>
        </section>

        <div class="results" id="results" aria-live="polite">
          <noscript>
            <div class="notice notice--error">This page requires JavaScript. / このページを使うにはJavaScriptを有効にしてください。 / 이 페이지는 JavaScript가 활성화되어 있어야 동작합니다.</div>
          </noscript>
        </div>
      </main>

      <footer class="footer" data-i18n="footer.disclaimer"></footer>
    </div>

        // ---- 다국어 ----------------------------------------------------------
        function translate(lang, key, params = {}) {
          const template = MESSAGES[lang]?.[key] ?? MESSAGES[DEFAULT_LANGUAGE][key] ?? key
          return template.replace(/\{(\w+)\}/g, (_, name) => String(params[name] ?? `{${name}}`))
        }

        function detectLanguage(candidates) {
          for (const candidate of candidates ?? []) {
            const code = String(candidate).toLowerCase().split('-')[0]
            if (MESSAGES[code]) return code
          }
          return DEFAULT_LANGUAGE
        }

        function initialLanguage() {
          const fromUrl = new URLSearchParams(window.location.search).get('lang')
          if (fromUrl && MESSAGES[fromUrl]) return fromUrl
          try {
            const saved = localStorage.getItem(LANGUAGE_STORAGE_KEY)
            if (saved && MESSAGES[saved]) return saved
          } catch {
            // 저장소를 쓸 수 없으면 브라우저 언어를 사용한다.
          }
          return detectLanguage(navigator.languages ?? [navigator.language])
        }

        let lang = initialLanguage()
        const t = (key, params) => translate(lang, key, params)
        const currentLocale = () => LANGUAGES.find((l) => l.code === lang).locale

        // ---- 시간 포맷 -------------------------------------------------------
        const UNITS = [
          ['year', 365 * 24 * 3600],
          ['month', 30 * 24 * 3600],
          ['day', 24 * 3600],
          ['hour', 3600],
          ['minute', 60],
        ]
        const formatterCache = new Map()

        function formatters() {
          const locale = currentLocale()
          if (!formatterCache.has(locale)) {
            formatterCache.set(locale, {
              relative: new Intl.RelativeTimeFormat(locale, { numeric: 'auto' }),
              dateTime: new Intl.DateTimeFormat(locale, {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                weekday: 'short',
                hour: 'numeric',
                minute: '2-digit',
                timeZoneName: 'short',
              }),
              date: new Intl.DateTimeFormat(locale, { year: 'numeric', month: 'long', day: 'numeric' }),
            })
          }
          return formatterCache.get(locale)
        }

        function formatRelative(iso) {
          const diffSec = Math.trunc((Date.parse(iso) - Date.now()) / 1000)
          const abs = Math.abs(diffSec)
          if (abs < 60) return t('time.justNow')
          const [unit, seconds] = UNITS.find(([, s]) => abs >= s)
          return formatters().relative.format(Math.trunc(diffSec / seconds), unit)
        }
        const formatDateTime = (iso) => formatters().dateTime.format(new Date(iso))
        const formatDate = (iso) => formatters().date.format(new Date(iso))

        // ---- DOM 헬퍼 (서버 응답은 항상 textContent 로만 삽입한다) ------------
        const $ = (id) => document.getElementById(id)

        function el(tag, props = {}, ...children) {
          const node = document.createElement(tag)
          for (const [key, value] of Object.entries(props)) {
            if (value == null || value === false) continue
            if (key === 'class') node.className = value
            else if (key === 'text') node.textContent = value
            else if (key.startsWith('on')) node.addEventListener(key.slice(2), value)
            else node.setAttribute(key, value === true ? '' : value)
          }
          node.append(...children.filter((child) => child != null && child !== false))
          return node
        }

        const relativeSpan = (iso) => el('span', { 'data-rel': iso, text: formatRelative(iso) })

        function safeAvatarUrl(value) {
          try {
            const url = new URL(value)
            return url.protocol === 'https:' && url.hostname.endsWith('.rbxcdn.com') ? url.href : null
          } catch {
            return null
          }
        }

        // ---- API -------------------------------------------------------------
        class LookupError extends Error {
          constructor(code, message, params = {}) {
            super(message)
            this.code = code
            this.params = params
          }
        }

        // 서버가 준 메시지 대신 오류 코드에 대응하는 현재 언어의 메시지를 만든다.
        function describeError(error) {
          if (error.code === 'API_UNREACHABLE') {
            return `${t('error.apiNotFound')}\n\n${t('error.triedAddresses')}\n${error.params.log}`
          }
          if (error.code === 'API_BAD_RESPONSE') return t('error.apiBadResponse', error.params)
          const key = `error.${error.code}`
          const text = t(key)
          return text === key ? t('error.UNKNOWN') : text
        }

        // 오류가 있으면 번역 키를, 없으면 null 을 반환한다.
        function validateQuery(mode, value) {
          if (!value) return mode === 'name' ? 'validate.nameEmpty' : 'validate.idEmpty'
          if (mode === 'name' && !USERNAME_PATTERN.test(value)) return 'validate.nameFormat'
          if (mode === 'id' && !USER_ID_PATTERN.test(value)) return 'validate.idFormat'
          return null
        }

        // 같은 출처에 /api 가 없으면(예: Live Server) 개발 서버(5173)를 찾아 사용한다.
        let apiBasePromise = null

        function candidateBases() {
          const { protocol, hostname } = window.location
          const bases = ['']
          if (/\.app\.github\.dev$/.test(hostname)) {
            bases.push(`${protocol}//${hostname.replace(/-\d+\./, '-5173.')}`)
          } else {
            const hosts = [...new Set([hostname, 'localhost', '127.0.0.1'])]
            for (const host of hosts) bases.push(`${protocol}//${host}:5173`, `${protocol}//${host}:3000`)
          }
          return bases
        }

        const probeLog = []

        async function probe(base) {
          const label = base || window.location.origin
          try {
            const res = await fetch(`${base}/api/health`, { credentials: base ? 'include' : 'same-origin' })
            const body = await res.json().catch(() => null)
            if (res.ok && body?.ok === true) return true
            probeLog.push(`${label} → HTTP ${res.status}${body ? '' : ' (not JSON)'}`)
          } catch (err) {
            probeLog.push(`${label} → connection failed (${err.name}: ${err.message})`)
          }
          return false
        }

        function resolveApiBase() {
          apiBasePromise ??= (async () => {
            probeLog.length = 0
            for (const base of candidateBases()) if (await probe(base)) return base
            apiBasePromise = null
            return null
          })()
          return apiBasePromise
        }

        async function fetchUser({ mode, value }, signal) {
          const base = await resolveApiBase()
          if (base === null) throw new LookupError('API_UNREACHABLE', '', { log: probeLog.join('\n') })
          let response
          try {
            response = await fetch(`${base}/api/user?${new URLSearchParams({ [mode]: value })}`, {
              signal,
              credentials: base ? 'include' : 'same-origin',
            })
          } catch (err) {
            if (err.name === 'AbortError') throw err
            throw new LookupError('NETWORK', '')
          }
          const body = await response.json().catch(() => null)
          if (!body) throw new LookupError('API_BAD_RESPONSE', '', { status: response.status })
          if (!response.ok) throw new LookupError(body.error?.code ?? 'UNKNOWN', body.error?.message ?? '')
          return body
        }

        // ---- 상태 ------------------------------------------------------------
        const form = $('form')
        const input = $('query')
        const submitButton = $('submit')
        const fieldError = $('field-error')
        const results = $('results')
        const recentBox = $('recent')
        const recentList = $('recent-list')

        const state = { mode: 'name', status: 'idle', data: null, error: null, controller: null, fieldErrorKey: null }
        let recent = readRecent()

        function readRecent() {
          try {
            const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY))
            return Array.isArray(parsed) ? parsed.filter((name) => typeof name === 'string') : []
          } catch {
            return []
          }
        }

        function writeRecent() {
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(recent))
          } catch {
            // 저장소를 쓸 수 없는 환경에서는 메모리에서만 유지한다.
          }
        }

        function addRecent(name) {
          recent = [name, ...recent.filter((n) => n.toLowerCase() !== name.toLowerCase())].slice(0, MAX_RECENT)
          writeRecent()
          renderRecent()
        }

        // ---- 렌더링 ----------------------------------------------------------
        function renderRecent() {
          recentList.replaceChildren(
            ...recent.map((name) =>
              el(
                'li',
                {},
                el('button', {
                  type: 'button',
                  class: 'chip',
                  text: name,
                  onclick: () => {
                    applyMode('name')
                    input.value = name
                    search({ mode: 'name', value: name })
                  },
                }),
              ),
            ),
          )
          recentBox.hidden = recent.length === 0
        }

        function skeleton() {
          return el(
            'div',
            { class: 'card card--skeleton', 'aria-hidden': 'true' },
            el(
              'div',
              { class: 'card__header' },
              el('div', { class: 'avatar skeleton' }),
              el(
                'div',
                { class: 'identity' },
                el('div', { class: 'skeleton skeleton--line skeleton--w60' }),
                el('div', { class: 'skeleton skeleton--line skeleton--w40' }),
              ),
            ),
            el('div', { class: 'skeleton skeleton--block' }),
          )
        }

        function errorNotice(error) {
          return el(
            'div',
            { class: 'notice notice--error', role: 'alert' },
            el('p', {
              class: 'notice__title',
              text: error.code === 'USER_NOT_FOUND' ? t('error.title.notFound') : t('error.title.generic'),
            }),
            el('p', { class: 'notice__body', text: describeError(error) }),
          )
        }

        function presencePanel(presence, tracking) {
          if (!presence.available) {
            const prefix = UNAVAILABLE_REASONS.includes(presence.reason)
              ? `presence.unavailable.${presence.reason}`
              : 'presence.unavailable'
            return el(
              'div',
              { class: 'presence presence--unavailable' },
              el('p', { class: 'presence__headline', text: t(`${prefix}.title`) }),
              el('p', { class: 'presence__note', text: t(`${prefix}.body`) }),
            )
          }

          const status = TONES[presence.status] ? presence.status : 'offline'
          const tone = TONES[status]
          const isActive = ACTIVE.includes(status)
          const detail = t(`status.${status}.detail`)
          const hasDetail = detail !== `status.${status}.detail`

          let body
          if (isActive) {
            body = [
              el('p', { class: 'presence__headline', text: t('presence.active') }),
              el('p', {
                class: 'presence__note',
                text: detail + (presence.lastLocation ? ` (${presence.lastLocation})` : ''),
              }),
            ]
          } else if (presence.lastOnline) {
            body = [
              el('p', { class: 'presence__headline' }, relativeSpan(presence.lastOnline)),
              el(
                'p',
                { class: 'presence__note' },
                el('time', { datetime: presence.lastOnline, text: formatDateTime(presence.lastOnline) }),
              ),
              presence.lastOnlineSource === 'tracked' &&
                el('p', { class: 'presence__note', text: t('presence.trackedNote') }),
              hasDetail && el('p', { class: 'presence__note', text: detail }),
            ]
          } else {
            body = [
              el('p', { class: 'presence__headline', text: t('presence.unknown') }),
              el('p', {
                class: 'presence__note',
                text: tracking?.enabled
                  ? t('presence.trackingStarted', { date: formatDateTime(tracking.since) })
                  : t('presence.hiddenNote'),
              }),
              el('p', { class: 'presence__note', text: t('presence.privacyNote') }),
            ]
          }

          return el(
            'div',
            { class: `presence presence--${tone}` },
            el(
              'div',
              { class: 'presence__top' },
              el(
                'span',
                { class: `status status--${tone}` },
                el('span', { class: 'status__dot', 'aria-hidden': 'true' }),
                t(`status.${status}`),
              ),
            ),
            el('p', { class: 'presence__label', text: isActive ? t('presence.current') : t('presence.last') }),
            ...body,
          )
        }

        function userCard(data, refreshing) {
          const { user, presence, tracking } = data
          const avatarUrl = data.avatarUrl && safeAvatarUrl(data.avatarUrl)

          const displayName = el('h2', { class: 'identity__display' }, el('span', { text: user.displayName }))
          if (user.hasVerifiedBadge) {
            displayName.insertAdjacentHTML('beforeend', VERIFIED_SVG)
            displayName.lastElementChild.setAttribute('aria-label', t('card.verified'))
          }

          const copyButton = el('button', { type: 'button', class: 'button', text: t('card.copy') })
          copyButton.addEventListener('click', async () => {
            try {
              await navigator.clipboard.writeText(window.location.href)
              copyButton.textContent = t('card.copied')
              setTimeout(() => (copyButton.textContent = t('card.copy')), 1800)
            } catch {
              // 클립보드 접근이 불가능한 환경(비보안 컨텍스트 등)에서는 조용히 무시한다.
            }
          })

          return el(
            'article',
            { class: 'card', 'aria-busy': String(refreshing) },
            el(
              'header',
              { class: 'card__header' },
              avatarUrl
                ? el('img', {
                    class: 'avatar',
                    src: avatarUrl,
                    alt: '',
                    width: '96',
                    height: '96',
                    referrerpolicy: 'no-referrer',
                  })
                : el('div', { class: 'avatar', 'aria-hidden': 'true' }),
              el(
                'div',
                { class: 'identity' },
                displayName,
                el('p', { class: 'identity__name', text: `@${user.name}` }),
                el(
                  'p',
                  { class: 'identity__meta' },
                  el('span', { text: t('card.id', { id: user.id }) }),
                  user.created &&
                    el('span', { text: t('card.joined', { date: formatDate(user.created), relative: formatRelative(user.created) }) }),
                ),
              ),
              user.isBanned && el('span', { class: 'tag tag--danger', text: t('card.banned') }),
            ),
            presencePanel(presence, tracking),
            user.description && el('p', { class: 'bio', text: user.description }),
            el(
              'footer',
              { class: 'card__actions' },
              el('button', {
                type: 'button',
                class: 'button',
                text: refreshing ? t('card.refreshing') : t('card.refresh'),
                disabled: refreshing,
                onclick: () => lookup({ mode: 'id', value: String(user.id) }, { keepData: true, remember: false }),
              }),
              copyButton,
              el('a', {
                class: 'button',
                href: `https://www.roblox.com/users/${encodeURIComponent(user.id)}/profile`,
                target: '_blank',
                rel: 'noopener noreferrer',
                text: t('card.profile'),
              }),
            ),
          )
        }

        function render() {
          const loading = state.status === 'loading'
          const refreshing = loading && state.data !== null

          results.replaceChildren(
            ...[
              loading && !refreshing && skeleton(),
              state.status === 'error' && errorNotice(state.error),
              state.data && userCard(state.data, refreshing),
            ].filter(Boolean),
          )
          submitButton.disabled = loading
          submitButton.textContent = loading ? t('search.loading') : t('search.submit')
        }

        // ---- 동작 ------------------------------------------------------------
        function applyMode(mode) {
          const config = MODES[mode]
          state.mode = mode
          form.elements.mode.value = mode
          $('query-label').textContent = t(`search.mode.${mode}`)
          input.placeholder = t(`search.placeholder.${mode}`)
          input.inputMode = config.inputMode
          input.maxLength = config.maxLength
        }

        // 오류는 번역 키로 보관해 언어를 바꿔도 즉시 다시 표시할 수 있게 한다.
        function showFieldError(key) {
          state.fieldErrorKey = key ?? null
          fieldError.textContent = key ? t(key) : ''
          input.setAttribute('aria-invalid', String(Boolean(key)))
          if (key) input.setAttribute('aria-describedby', 'field-error')
          else input.removeAttribute('aria-describedby')
        }

        function applyStaticTranslations() {
          document.documentElement.lang = lang
          document.title = t('app.title')
          document.querySelector('meta[name="description"]').setAttribute('content', t('app.description'))
          for (const node of document.querySelectorAll('[data-i18n]')) node.textContent = t(node.dataset.i18n)
          for (const node of document.querySelectorAll('[data-i18n-aria]')) {
            node.setAttribute('aria-label', t(node.dataset.i18nAria))
          }
        }

        function setLanguage(next) {
          if (!MESSAGES[next]) return
          lang = next
          try {
            localStorage.setItem(LANGUAGE_STORAGE_KEY, next)
          } catch {
            // 저장소를 쓸 수 없는 환경에서는 이번 세션에서만 유지한다.
          }
          applyStaticTranslations()
          applyMode(state.mode)
          showFieldError(state.fieldErrorKey)
          render()
        }

        async function lookup(query, { keepData = false, remember = true } = {}) {
          state.controller?.abort()
          const controller = new AbortController()
          state.controller = controller

          state.status = 'loading'
          state.error = null
          if (!keepData) state.data = null
          render()

          try {
            const data = await fetchUser(query, controller.signal)
            state.status = 'success'
            state.data = data
            if (remember) addRecent(data.user.name)
          } catch (err) {
            if (err.name === 'AbortError') return
            state.status = 'error'
            state.data = null
            state.error = err
          }
          render()
        }

        function search(query, { push = true } = {}) {
          const message = validateQuery(query.mode, query.value)
          showFieldError(message)
          if (message) return

          if (push) {
            window.history.pushState(null, '', `?${new URLSearchParams({ [query.mode]: query.value })}`)
          }
          return lookup(query)
        }

        function readUrlQuery() {
          const params = new URLSearchParams(window.location.search)
          if (params.get('name')) return { mode: 'name', value: params.get('name') }
          if (params.get('id')) return { mode: 'id', value: params.get('id') }
          return null
        }

        form.addEventListener('submit', (event) => {
          event.preventDefault()
          search({ mode: state.mode, value: input.value.trim() })
        })

        form.elements.mode.forEach((radio) =>
          radio.addEventListener('change', () => {
            applyMode(radio.value)
            input.value = ''
            showFieldError(null)
          }),
        )

        input.addEventListener('input', () => {
          if (input.getAttribute('aria-invalid') === 'true') showFieldError(null)
        })

        $('recent-clear').addEventListener('click', () => {
          recent = []
          writeRecent()
          renderRecent()
        })

        window.addEventListener('popstate', () => {
          const query = readUrlQuery()
          if (query) {
            applyMode(query.mode)
            input.value = query.value
            search(query, { push: false })
          } else {
            state.controller?.abort()
            Object.assign(state, { status: 'idle', data: null, error: null })
            input.value = ''
            showFieldError(null)
            render()
          }
        })

        // 상대 시간("3시간 전")을 주기적으로 갱신한다.
        setInterval(() => {
          for (const node of document.querySelectorAll('[data-rel]')) {
            node.textContent = formatRelative(node.dataset.rel)
          }
        }, 30_000)

        const langSelect = $('lang')
        langSelect.replaceChildren(...LANGUAGES.map((l) => el('option', { value: l.code, text: l.label })))
        langSelect.value = lang
        langSelect.addEventListener('change', () => setLanguage(langSelect.value))

        renderRecent()
        const initial = readUrlQuery()
        applyStaticTranslations()
        applyMode(initial?.mode ?? 'name')
        if (initial) {
          input.value = initial.value
          search(initial, { push: false })
        }
      })()
    </script>
  </body>
</html>
